name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# ה-workflow הזה גם **מפרסם**: כל דחיפה ל-main שכל הבדיקות בה עברו מקדמת
# את מספר הגרסה ומעלה release חדש (ראו הג'וב `publish` בסוף). הפרסום יושב
# כאן ולא ב-workflow נפרד כדי לא לבנות את החנות פעמיים על אותו קומיט —
# הג'וב שבונה כאן מייצר ממילא בדיוק את הקובץ שמופץ.
permissions:
  contents: write

jobs:
  # ── מספר הגרסה של הריצה הזאת ────────────────────────────────────────────────
  # המספור הוא מספר שלם אחד: 1, 2, 3… (ראו `tool/set_version.sh`).
  #
  # הבא בתור נגזר מ**התגים שכבר קיימים** ולא מ-`native/VERSION` לבדו:
  # הקובץ יכול להיות מאחור (למשל אחרי revert), ותג שנתפס פעמיים היה דורס
  # release קיים בקבצים של בנייה אחרת.
  version:
    name: next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # התגים נחוצים כדי לדעת מה כבר פורסם
      - id: next
        run: |
          set -euo pipefail
          # הגבוה שבין "מה שבקובץ" ל"התג הגבוה שפורסם", ועוד אחד.
          current="$(tr -d '[:space:]' < native/VERSION)"
          # `v1`, `v2`… תג שאינו בצורה הזאת (למשל `v0.1.0` מריפו אחר, או תג
          # ידני בשם `V1`) אינו נספר בכלל — `sort -n` היה מדרג אותו כמספר.
          #
          # ה-`|| true` אינו קוסמטי: `grep` בלי התאמות מחזיר 1, ועם
          # `pipefail` זה הפיל את הצעד כולו בריפו שעוד אין בו תגים —
          # כלומר בדיוק בפרסום הראשון.
          highest="$( { git tag --list 'v[0-9]*' \
            | grep -E '^v[0-9]+$' \
            | sed 's/^v//' | sort -n | tail -1; } || true )"
          highest="${highest:-0}"

          next=$(( (current > highest ? current : highest) + 1 ))

          # חגורה שנייה: אם התג הבא כבר קיים משום מה, מתקדמים לפנוי.
          while git rev-parse -q --verify "refs/tags/v$next" >/dev/null; do
            next=$(( next + 1 ))
          done

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "VERSION=$current, התג הגבוה=$highest → הגרסה הבאה היא $next (תג v$next)"

  # ── בדיקות הלוגיקה ──────────────────────────────────────────────────────────
  # כל הלוגיקה של החנות היא JS, והבדיקות רצות על `node --test` המובנה —
  # **בלי שום תלות npm**. ולכן גם על ubuntu: אין כאן דבר שתלוי בווינדוס
  # (מה שכן תלוי בה יושב ב-host, ונבדק בבנייה שמתחת).
  tests:
    name: node --test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test

  # ── בנייה ואריזה ל-exe בודד ─────────────────────────────────────────────────
  build:
    name: windows build
    needs: [version, tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # לפני הכול: הגרסה של הריצה הזאת נכנסת ל-`native/VERSION`, ומשם
      # למשאב הגרסה של ה-exe ולמה שהתוכנה מדווחת על עצמה.
      - name: Set the release version
        shell: bash
        run: bash tool/set_version.sh "${{ needs.version.outputs.version }}"
      # ⚠️ אין כאן התקנת SDK של שפה כלשהי: הבנייה היא `cl.exe` שמגיע עם
      # windows-latest, וה-SDK של WebView2 מובא מ-nuget ע"י הסקריפט עצמו.
      - name: Build
        shell: pwsh
        run: .\native\build.ps1
      # מאמת את ההבטחה המרכזית של הפרויקט: **קובץ אחד**, בלי DLL לידו
      # ובלי תיקיית חילוץ. רגרסיה כאן שקטה לגמרי אחרת — ה-exe פשוט לא
      # יעלה על מחשב שאין בו את מה שנשכח.
      - name: Assert a single self-contained exe
        shell: pwsh
        run: |
          $out = 'native\build'
          $stray = Get-ChildItem $out -File |
            Where-Object { $_.Extension -in '.dll', '.pdb' -or
                           $_.Name -eq 'app-files' }
          if ($stray) {
            Write-Error "קבצים שאינם אמורים להתפרסם: $($stray.Name -join ', ')"
            exit 1
          }
          $exe = Get-ChildItem $out -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { Write-Error 'לא נוצר exe'; exit 1 }
          $mb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "$($exe.Name) — $mb MB"
          # תקרה רופפת בכוונה: היא כאן כדי לתפוס חזרה בשוגג לצירוף מנוע
          # שלם (11.8MB בגרסת ה-Flutter), לא כדי לרדוף אחרי קילובייטים.
          if ($mb -gt 5) {
            Write-Error "ה-exe תפח ל-$mb MB — היעד הוא כמה MB בודדים"
            exit 1
          }
      # glob ולא השם המלא: הקובץ הוא "חנות התוספים.exe", ואין טעם לתלות
      # את ה-workflow בקידוד של שם עברי.
      - uses: actions/upload-artifact@v4
        with:
          name: otzaria_plugin_store-windows
          path: native/build/*.exe
          if-no-files-found: error

  # ── פרסום אוטומטי ───────────────────────────────────────────────────────────
  # דחיפה ל-main שכל הג'ובים שמעל עברו בה: מקדמים את הגרסה בקוד, מתייגים,
  # ומעלים release עם ה-exe.
  #
  # אין כאן בנייה נוספת: הקובץ הוא הארטיפקט של הג'וב שלמעלה, ולכן מה
  # שמפורסם הוא בדיוק מה שנבדק.
  publish:
    name: publish release
    needs: [version, tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # פרסום אחד בכל רגע: שתי דחיפות צמודות היו מנסות לתייג במקביל.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Bump the version in the repository
        run: |
          bash tool/set_version.sh "${{ needs.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `[skip ci]` הוא חגורה נוספת: דחיפה עם GITHUB_TOKEN אינה מפעילה
          # workflow חדש בלאו הכי, ולכן אין כאן לופ.
          git diff --quiet || git commit -am "גרסה ${{ needs.version.outputs.version }} [skip ci]"
      - name: Tag and push
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          # התג נבדק שוב **עכשיו**: בין תחילת הריצה לכאן יכול היה להתפרסם
          # release אחר, ולדרוס אותו בקבצים של בנייה אחרת זו הפגיעה הגרועה
          # מכולן. כישלון רועש כאן עדיף — דחיפה נוספת תקבל מספר פנוי.
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag כבר קיים — יש להריץ מחדש כדי לקבל מספר פנוי"
            exit 1
          fi
          git tag "$tag"
          git push origin HEAD:main
          git push origin "$tag"
      # גיטהאב מנקה תווים שאינם ASCII משמות של נכסי release, ולכן
      # `חנות התוספים.exe` — שם שכולו עברית — היה מתפרסם כ-`default.exe`.
      # השם שעל הדיסק נשאר עברי; רק מה שיושב על ה-release מקבל שם לטיני,
      # והוא גם השם שנדבק למי שמוריד.
      - name: Give the Windows asset an ASCII name
        run: |
          set -euo pipefail
          exe="$(find release-assets -maxdepth 1 -name '*.exe' | head -1)"
          if [ -z "$exe" ]; then
            echo "::error::לא נמצא exe בארטיפקטים — release בלי הקובץ גרוע מג'וב אדום"
            exit 1
          fi
          if [ "$exe" != "release-assets/Otzaria-Plugin-Store.exe" ]; then
            mv "$exe" release-assets/Otzaria-Plugin-Store.exe
          fi
          # מה שנשאר שם חייב להיות קבצים בלבד — תיקייה נכשלת בהעלאה.
          find release-assets -maxdepth 1 -mindepth 1 -type d -exec rm -rf {} +
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release-assets
          # **יציב** ולא pre-release/draft: בדיקת הגרסה שבתוכנה פוסלת את
          # שניהם (ראו `store_release_client.js`), וגם הורדה ידנית
          # מ-"Latest" לא מוצאת draft.
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "גרסה ${{ needs.version.outputs.version }}" \
            --generate-notes \
            release-assets/*
